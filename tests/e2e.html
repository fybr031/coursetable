<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>e2e</title>
<style>
  body { font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 0; display: flex; gap: 10px; }
  #results { flex: 1; padding: 12px; white-space: pre-wrap; background: #0f131c; color: #d8e2f5; margin: 0; }
  iframe { width: 390px; height: 844px; border: 0; flex: 0 0 auto; }
  .pass { color: #4ade80; } .fail { color: #f87171; }
</style>
</head>
<body>
<pre id="results">running…</pre>
<iframe id="frame"></iframe>
<script>
const out = [];
let failed = 0;
function log(ok, name, extra) {
  if (!ok) failed++;
  out.push((ok ? 'PASS' : 'FAIL') + ' | ' + name + (extra !== undefined ? ' | ' + extra : ''));
  document.getElementById('results').textContent = out.join('\n');
  document.title = failed ? 'FAILED:' + failed : 'ALLPASS';
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const SAMPLE_HTML = `<html><body><table>
<tr><th>节次</th><th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th></tr>
<tr><td>第1-2节</td><td>线性代数<br>陈老师<br>1-16周<br>教三-201</td><td></td><td></td><td></td><td></td></tr>
<tr><td>第3-4节</td><td></td><td>数据结构<br>孙老师<br>1-16周<br>C区402</td><td></td><td></td><td></td></tr>
</table></body></html>`;

const frame = document.getElementById('frame');

// 每次测试都从干净状态开始（同源，直接清掉 App 的存储）
try { localStorage.removeItem('coursetable.v1'); } catch (e) {}
frame.src = '../index.html?demo=1';

frame.addEventListener('load', async () => {
  try {
    await wait(500);
    const w = frame.contentWindow;
    const d = frame.contentDocument;
    const App = w.CourseTableApp;

    log(!!App, 'App 已初始化');
    if (!App) throw new Error('CourseTableApp 不存在，app.js 可能报错');

    /* ---------- 1. 示例数据 ---------- */
    log(App.state.courses.length === 9, '示例课表载入 9 门课', App.state.courses.length);
    log(d.querySelectorAll('#dayStrip .day-chip').length === 7, '星期条渲染 7 天');

    /* ---------- 2. 日视图 ---------- */
    const cards = d.querySelectorAll('#dayView .lesson');
    log(cards.length > 0, '日视图渲染课程卡片', cards.length);
    log(/高等数学/.test(d.getElementById('dayView').textContent), '日视图含课程名');
    log(d.querySelectorAll('#dayView .lesson-name').length === cards.length, '每张卡片都有标题');

    /* ---------- 3. 周视图 ---------- */
    d.querySelector('.tab[data-view="week"]').click();
    await wait(120);
    const wk = d.querySelectorAll('#weekView .wk-course');
    log(wk.length >= 6, '周视图渲染课程块', wk.length);
    log(d.querySelectorAll('#weekView .wk-dayhead').length === 7, '周视图 7 列表头');
    log(!d.getElementById('weekView').hidden && d.getElementById('dayView').hidden, '视图切换生效');

    /* ---------- 4. 课程详情 ---------- */
    wk[0].click();
    await wait(120);
    log(!!d.getElementById('btnEditCourse'), '点课程弹出详情面板');
    log(!!d.getElementById('btnDelCourse'), '详情有删除按钮');
    d.getElementById('sheetClose').click();
    await wait(320);

    /* ---------- 5. 导入（HTML 课表，替换） ---------- */
    const res = App.parser.autoParse(SAMPLE_HTML);
    log(res.ok, '解析样例课表 HTML', (res.courses || []).length + ' 门');
    App.applyImport(res.courses, true);
    await wait(150);
    log(App.state.courses.length === 2, '替换导入生效', App.state.courses.length);
    log(App.state.courses.some((c) => c.name === '线性代数' && c.day === 1 && c.start === 1), '导入课程字段正确（周1第1节）');
    const lin = App.state.courses.find((c) => c.name === '线性代数');
    log(lin.teacher === '陈老师' && lin.room === '教三-201', '教师/教室解析正确', lin.teacher + '/' + lin.room);

    /* ---------- 6. 手动添加 ---------- */
    const before = App.state.courses.length;
    App.openEditor(null);
    await wait(150);
    log(!!d.getElementById('f_name'), '编辑面板打开');
    d.getElementById('f_name').value = '手动加的课';
    d.getElementById('f_room').value = 'D101';
    d.getElementById('f_day').value = '5';
    d.getElementById('f_start').value = '3';
    d.getElementById('f_end').value = '4';
    d.getElementById('f_wmode').value = 'range';
    d.getElementById('f_wmode').dispatchEvent(new w.Event('change'));
    d.getElementById('f_from').value = '2';
    d.getElementById('f_to').value = '10';
    d.getElementById('f_parity').value = 'odd';
    d.getElementById('btnSave').click();
    await wait(200);
    log(App.state.courses.length === before + 1, '新增课程成功', App.state.courses.length);
    const added = App.state.courses.find((c) => c.name === '手动加的课');
    log(added && added.day === 5 && added.start === 3 && added.end === 4, '新增课程字段正确');
    log(added && added.weeks.join(',') === '3,5,7,9', '单双周生成正确（2-10单周）', added && added.weeks.join(','));

    /* ---------- 7. 设置 ---------- */
    App.openSettings();
    await wait(150);
    log(!!d.getElementById('s_start'), '设置面板打开');
    log(d.getElementById('s_start').value === App.state.settings.termStart, '学期开始日期回填正确');
    d.getElementById('s_total').value = '18';
    d.getElementById('btnSaveSettings').click();
    await wait(200);
    log(App.state.settings.totalWeeks === 18, '设置保存生效');

    /* ---------- 8. 持久化 / 备份 ---------- */
    const json = App.buildJson();
    let parsed = null;
    try { parsed = JSON.parse(json); } catch (e) {}
    log(!!parsed && Array.isArray(parsed.courses) && parsed.courses.length === App.state.courses.length, '备份 JSON 合法', json.length + ' 字节');
    const stored = w.localStorage.getItem('coursetable.v1');
    log(!!stored && JSON.parse(stored).courses.length === App.state.courses.length, 'localStorage 持久化正常');

    /* ---------- 9. 周次切换 ---------- */
    const wkBefore = App.state.week;
    d.getElementById('btnNextWeek').click();
    await wait(120);
    log(App.state.week === wkBefore + 1 || wkBefore >= App.state.settings.totalWeeks, '下一周按钮生效', App.state.week);
    d.getElementById('btnToday').click();
    await wait(120);
    log(App.state.week >= 1, '回到今天生效', App.state.week);

    /* ---------- 10. 空周不报错 ---------- */
    App.state.week = 40;
    App.render();
    await wait(120);
    log(d.querySelectorAll('#dayStrip .day-chip').length === 7, '空周仍正常渲染');

    /* ---------- 11. 控制台错误 ---------- */
    log(window.__errors === undefined || window.__errors.length === 0, '无脚本异常');
  } catch (e) {
    log(false, '执行异常', String(e && e.stack || e));
  }
  document.getElementById('results').textContent =
    out.join('\n') + '\n\n===== ' + (failed ? 'FAILED ' + failed : 'ALL PASS') + ' =====';
  document.title = failed ? 'FAILED:' + failed : 'ALLPASS';
});

// 捕获 iframe 内的未处理异常
window.addEventListener('error', (e) => { out.push('FAIL | 顶层错误: ' + e.message); });
</script>
</body>
</html>
