<style>
/* ============================================================
   课程表 App 样式  ·  移动端优先
   ============================================================ */
:root {
  --bg: #f4f6fb;
  --bg-soft: #ffffff;
  --card: #ffffff;
  --card-2: #f7f9fe;
  --text: #1b1f2a;
  --text-2: #5c6478;
  --text-3: #98a0b3;
  --line: #e6eaf3;
  --accent: #4f7cff;
  --accent-soft: #e8eeff;
  --danger: #ef4b5f;
  --shadow: 0 6px 20px rgba(24, 44, 96, .08);
  --shadow-lg: 0 -10px 40px rgba(20, 32, 60, .18);
  --radius: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  -webkit-tap-highlight-color: transparent;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f131c;
    --bg-soft: #161c28;
    --card: #182030;
    --card-2: #1e2739;
    --text: #e8edf7;
    --text-2: #97a2b8;
    --text-3: #6b7688;
    --line: #263145;
    --accent: #6c93ff;
    --accent-soft: #1d2b4d;
    --shadow: 0 6px 20px rgba(0, 0, 0, .35);
    --shadow-lg: 0 -10px 40px rgba(0, 0, 0, .5);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overscroll-behavior: none;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }

.app {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  background: var(--bg);
}

/* ---------------- 顶栏 ---------------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(var(--safe-t) + 10px) 12px 8px;
}

.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--shadow);
  font-size: 17px;
  color: var(--text-2);
  flex: 0 0 auto;
  transition: transform .12s ease;
}
.icon-btn:active { transform: scale(.92); }

.week-nav {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.arrow {
  width: 30px; height: 34px;
  border-radius: 10px;
  font-size: 20px;
  color: var(--text-3);
  line-height: 1;
  display: grid; place-items: center;
}
.arrow:active { background: var(--card-2); }

.week-label {
  display: flex; flex-direction: column; align-items: center;
  min-width: 132px;
  padding: 2px 8px;
  border-radius: 10px;
}
.week-label b { font-size: 17px; letter-spacing: .3px; }
.week-label small { color: var(--text-3); font-size: 11px; }
.week-label .cur-tag {
  font-size: 10px; color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 6px; padding: 0 4px; margin-left: 4px;
  vertical-align: 2px;
}

/* ---------------- 星期条 ---------------- */
.day-strip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  padding: 4px 10px 10px;
}

.day-strip[hidden] { display: none; }

.day-chip {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0 5px;
  border-radius: 12px;
  color: var(--text-2);
  position: relative;
  transition: background .15s ease, color .15s ease;
}
.day-chip span { font-size: 11px; color: var(--text-3); }
.day-chip b { font-size: 15px; font-weight: 600; }
.day-chip .dot {
  position: absolute; bottom: 2px;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent); opacity: 0;
}
.day-chip.has-course .dot { opacity: 1; }
.day-chip.today b { color: var(--accent); }
.day-chip.selected {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 6px 14px rgba(79, 124, 255, .32);
}
.day-chip.selected span, .day-chip.selected b { color: #fff; }
.day-chip.selected .dot { background: #fff; }

/* ---------------- 主区域 ---------------- */
.main { overflow-y: auto; overflow-x: hidden; padding: 0 10px 14px; -webkit-overflow-scrolling: touch; }

.view { animation: fade .18s ease; }
@keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------------- 日视图 ---------------- */
.day-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 2px 4px 10px;
  color: var(--text-2);
  font-size: 13px;
}
.day-head b { color: var(--text); font-size: 15px; }

.lesson {
  display: grid;
  grid-template-columns: 62px 1fr;
  gap: 10px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
  animation: fade .2s ease;
}
.lesson::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--c, var(--accent));
}
.lesson.now { box-shadow: 0 8px 26px rgba(79, 124, 255, .22); }
.lesson.past { opacity: .62; }

.lesson-time {
  text-align: center;
  border-right: 1px dashed var(--line);
  padding-right: 8px;
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
}
.lesson-time b { font-size: 14px; color: var(--text); }
.lesson-time em { font-style: normal; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }

.lesson-body { min-width: 0; }
.lesson-name {
  font-size: 16px; font-weight: 600;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.lesson-name .tag {
  font-size: 10px; font-weight: 500;
  padding: 1px 6px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent);
}
.lesson-meta {
  margin-top: 3px;
  font-size: 12.5px; color: var(--text-2);
  display: flex; flex-wrap: wrap; gap: 3px 10px;
}
.lesson-meta i { font-style: normal; }
.lesson-week { margin-top: 2px; font-size: 11px; color: var(--text-3); }

.empty {
  text-align: center;
  padding: 52px 20px;
  color: var(--text-3);
}
.empty .big { font-size: 40px; margin-bottom: 12px; }
.empty p { margin: 6px 0 18px; font-size: 13.5px; line-height: 1.7; }
.empty .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ---------------- 周视图 ---------------- */
.wk-wrap {
  overflow: auto;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding-bottom: 6px;
}
.wk-grid {
  display: grid;
  width: 100%;
}
.wk-corner, .wk-dayhead {
  position: sticky; top: 0;
  background: var(--card);
  z-index: 3;
  border-bottom: 1px solid var(--line);
}
.wk-dayhead {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 5px 2px; gap: 1px;
  font-size: 12px; color: var(--text-2);
}
.wk-dayhead b { font-size: 12.5px; }
.wk-dayhead small { font-size: 9.5px; color: var(--text-3); }
.wk-dayhead.today { color: var(--accent); }
.wk-dayhead.today b { color: var(--accent); }

.wk-time {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-top: 1px solid var(--line);
  border-right: 1px solid var(--line);
  position: sticky; left: 0;
  background: var(--card);
  z-index: 2;
  font-variant-numeric: tabular-nums;
}
.wk-time b { font-size: 11px; color: var(--text-2); }
.wk-time small { font-size: 9px; color: var(--text-3); }

.wk-cell { border-top: 1px solid var(--line); border-right: 1px solid var(--line); }

.wk-course {
  margin: 2px 0;
  padding: 2px 2px;
  border-radius: 5px;
  background: var(--c, var(--accent));
  color: #fff;
  font-size: 9px;
  line-height: 1.2;
  overflow: hidden;
  z-index: 1;
  display: flex; flex-direction: column; gap: 0;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .12);
  overflow-wrap: anywhere;
  word-break: break-word;
  cursor: pointer;
}
.wk-course b { font-size: 10px; font-weight: 600; line-height: 1.2; letter-spacing: -.2px; }
.wk-course span { opacity: .9; font-size: 8.5px; line-height: 1.2; }

/* ---------------- 底部栏 ---------------- */
.tabbar {
  display: flex;
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-soft) 88%, transparent);
  backdrop-filter: blur(14px);
  padding-bottom: var(--safe-b);
}
.tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 7px;
  color: var(--text-3);
  font-size: 10px;
}
.tab i { font-style: normal; font-size: 19px; line-height: 1; }
.tab.active { color: var(--accent); }

/* ---------------- 弹层 ---------------- */
.sheet-mask {
  position: fixed; inset: 0;
  background: rgba(12, 18, 32, .44);
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease;
  z-index: 40;
  backdrop-filter: blur(2px);
}
.sheet-mask.show { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 720px;
  margin: 0 auto;
  max-height: 88dvh;
  background: var(--bg-soft);
  border-radius: 20px 20px 0 0;
  box-shadow: var(--shadow-lg);
  transform: translateY(102%);
  transition: transform .26s cubic-bezier(.32, .72, .28, 1);
  z-index: 41;
  display: flex; flex-direction: column;
  padding-bottom: var(--safe-b);
}
.sheet.show { transform: translateY(0); }

.sheet-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.sheet-head h2 { margin: 0; font-size: 16px; flex: 1; }
.sheet-head .close { color: var(--text-3); font-size: 20px; width: 30px; height: 30px; }
.sheet-body { padding: 14px 16px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

.field { margin-bottom: 13px; }
.field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; }
.field .hint { font-size: 11px; color: var(--text-3); margin-top: 4px; }

.input, .select, .textarea {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 12px;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.textarea { min-height: 120px; resize: vertical; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 16px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 14px;
  transition: transform .12s ease, opacity .12s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.row-btns { display: flex; gap: 10px; margin-top: 6px; }
.row-btns .btn { flex: 1; }

.import-tabs {
  display: flex; gap: 6px;
  background: var(--card-2);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 14px;
}
.import-tabs button {
  flex: 1; padding: 8px 4px; border-radius: 9px;
  font-size: 13px; color: var(--text-2);
}
.import-tabs button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }

.tip {
  background: var(--card-2);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 12.5px;
  color: var(--text-2);
  line-height: 1.65;
}
.tip b { color: var(--text); }
.tip ol, .tip ul { margin: 6px 0 0; padding-left: 18px; }
.tip li { margin: 2px 0; }

.preview-list { margin-top: 12px; border-top: 1px solid var(--line); }
.preview-item {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 8px;
  padding: 8px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  align-items: center;
}
.preview-item .pday { color: var(--text-3); font-size: 11.5px; }
.preview-item .pname { font-weight: 500; }
.preview-item .pmeta { color: var(--text-3); font-size: 11px; }
.preview-item .bad { color: var(--danger); }

.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  gap: 12px;
}
.settings-row .label { font-size: 14px; }
.settings-row .desc { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }

.period-row {
  display: grid;
  grid-template-columns: 34px 1fr 14px 1fr;
  gap: 8px; align-items: center;
  margin-bottom: 8px;
}
.period-row .pn { font-size: 12px; color: var(--text-3); text-align: center; }
.period-row .input { padding: 7px 8px; font-size: 13px; text-align: center; }

/* toast */
.toast {
  position: fixed;
  left: 50%; bottom: calc(var(--safe-b) + 78px);
  transform: translate(-50%, 12px);
  background: rgba(22, 28, 42, .94);
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 13px;
  max-width: 84vw;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 60;
  box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 首次使用 */
.hero { padding: 26px 8px 8px; text-align: center; }
.hero .logo { font-size: 46px; }
.hero h1 { font-size: 20px; margin: 10px 0 6px; }
.hero p { color: var(--text-2); font-size: 13.5px; margin: 0 0 20px; line-height: 1.7; }

.chip {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 20px;
  background: var(--card-2);
  color: var(--text-2);
  font-size: 11.5px;
  margin: 0 3px 6px 0;
}

.link { color: var(--accent); text-decoration: none; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 360px) {
  .lesson { grid-template-columns: 54px 1fr; }
  .week-label { min-width: 112px; }
}

<script>
/*!
 * 课程表解析引擎 CourseParser v1.0
 * 无依赖，同时适用于浏览器与 Node。
 * 能力：
 *   1. 课表网面 HTML -> 课程（自动找最像课表的 <table>，处理 rowspan/colspan）
 *   2. Excel / 网页复制的制表符文本(TSV) -> 课程
 *   3. CSV -> 课程
 *   4. 纯文本兜底解析
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CourseParser = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ============================ 基础工具 ============================ */

  var CN_NUM = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10, '十一': 11, '十二': 12 };
  var WD_CN = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 7, '天': 7, '七': 7 };
  var WD_EN = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6, sun: 7 };

  function toHalfWidth(s) {
    return s.replace(/[０-９Ａ-Ｚａ-ｚ]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
  }

  /** 归一化文本：全角转半角、统一换行、压缩空白、去掉不可见字符（保留制表符） */
  function normText(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/\u00a0|\u3000/g, ' ')
      .replace(/\u200b|\ufeff/g, '')
      .replace(/[０-９Ａ-Ｚａ-ｚ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[（【]/g, '(')
      .replace(/[）】]/g, ')')
      .replace(/[－—–―]/g, '-')
      .replace(/～/g, '~')
      .replace(/\r\n?/g, '\n')
      .split('\n')
      .map(function (line) {
        return line
          .replace(/^[ \t]+|[ \t]+$/g, '')   // 行首行尾空白
          .replace(/ {2,}/g, ' ');           // 压缩连续空格，但保留 \t
      })
      .join('\n')
      .replace(/\n{2,}/g, '\n')
      .trim();
  }

  function cnNum(str) {
    if (!str) return 0;
    if (/^\d+$/.test(str)) return parseInt(str, 10);
    return CN_NUM[str] || 0;
  }

  function uniq(arr) {
    var seen = {}, out = [];
    arr.forEach(function (v) { if (v != null && !seen[v]) { seen[v] = 1; out.push(v); } });
    return out;
  }

  /* ============================ 字段解析 ============================ */

  /** 从文本中识别星期几，1=周一 ... 7=周日 */
  function weekdayFromText(text) {
    var s = normText(text).replace(/\s+/g, '');
    if (!s || s.length > 24) return 0;
    var m = s.match(/(?:星期|周|礼拜)([一二三四五六日天])/);
    if (m) return WD_CN[m[1]];
    m = s.match(/^(mon|tues?|wed(?:nes)?|thu(?:rs)?|fri|sat(?:ur)?|sun)(?:day)?$/i);
    if (m) return WD_EN[m[1].slice(0, 3).toLowerCase()];
    return 0;
  }

  /** 解析节次，返回 {start, end} */
  function parseSlots(text) {
    var s = normText(text).replace(/\s+/g, '');
    if (!s) return null;
    var m = s.match(/第?(\d{1,2})(?:[-,、~至](\d{1,2}))?节/);
    if (m) return { start: +m[1], end: +(m[2] || m[1]) };
    m = s.match(/^(\d{1,2})(?:[-,~](\d{1,2}))?$/);
    if (m) return { start: +m[1], end: +(m[2] || m[1]) };
    m = s.match(/第?([一二三四五六七八九十]{1,3})节/);
    if (m) { var n = cnNum(m[1]); if (n) return { start: n, end: n }; }
    return null;
  }

  /** 解析周次，返回 {weeks:[...], parity:'all'|'odd'|'even', raw} 或 null */
  function parseWeeks(text) {
    var s = normText(text).replace(/\s+/g, '');
    if (!s || s.indexOf('周') < 0) return null;
    var parity = 'all';
    // 只有「单/双」紧跟周次时才算单双周，避免课程名里的「单」「双」误伤
    if (/[单双]\s*周/.test(s) || /周\s*[(]?\s*[单双]\s*[)]?/.test(s)) {
      parity = /双\s*周/.test(s) || /周\s*[(]?\s*双/.test(s) ? 'even' : 'odd';
    }

    var weeks = [];
    // 取出所有 “…周” 前面的那段（可能是 1-16 / 1,3,5 / 3 / 1-8,10-16）
    var re = /(\d{1,2}(?:\s*[-~至]\s*\d{1,2})?(?:\s*[,、]\s*\d{1,2}(?:\s*[-~至]\s*\d{1,2})?)*)\s*[单双]?\s*周/g;
    var m, hit = false;
    while ((m = re.exec(s))) {
      hit = true;
      m[1].split(/[,、]/).forEach(function (seg) {
        var r = seg.split(/[-~至]/);
        var a = parseInt(r[0], 10);
        var b = parseInt(r[1], 10);
        if (isNaN(a)) return;
        if (isNaN(b)) b = a;
        if (b < a) { var t = a; a = b; b = t; }
        for (var i = a; i <= b && i <= 60; i++) weeks.push(i);
      });
    }
    if (!hit) {
      // “第3周” 之类已被覆盖；“全周/每周” 无数字
      return null;
    }
    weeks = uniq(weeks).sort(function (a, b) { return a - b; });
    if (parity === 'odd') weeks = weeks.filter(function (w) { return w % 2 === 1; });
    if (parity === 'even') weeks = weeks.filter(function (w) { return w % 2 === 0; });
    if (!weeks.length) return null;
    return { weeks: weeks, parity: parity, raw: normText(text) };
  }

  /** 教室/地点识别 */
  function looksLikeRoom(t) {
    var s = normText(t).replace(/\s+/g, '');
    if (!s || s.length > 30) return false;
    if (/(楼|教室|机房|实验|实训|报告厅|阶梯|语音|体育馆|操场|馆|室|lab|Lab|LAB|中心|基地)/.test(s)) return true;
    if (/^[A-Za-z]{1,2}\d{2,4}[A-Za-z]?$/.test(s)) return true;          // A101 / B203
    if (/^[A-Za-z]?\d{1,2}[-#]\d{2,4}(-\d{1,3})?$/.test(s)) return true; // 3-201 / 1#305
    if (/^[A-Za-z]{2,6}\d{2,4}$/.test(s)) return true;                    // JX0301
    return false;
  }

  /** 教师名识别（弱判断，仅作兜底） */
  function looksLikeTeacher(t) {
    var s = normText(t).replace(/\s+/g, '');
    if (!s || s.length > 20) return false;
    if (/\d/.test(s)) return false;
    if (/[周节室楼馆课学导论（(]/.test(s)) return false;
    if (/^(星期一|星期二|星期三|星期四|星期五|星期六|星期日|周一|周二|周三|周四|周五|周六|周日)$/.test(s)) return false;
    return /^[\u4e00-\u9fa5]{2,4}$/.test(s) || /^[\u4e00-\u9fa5]{2,4}(、[\u4e00-\u9fa5]{2,4})+$/.test(s) || /^[A-Za-z][A-Za-z. ]{1,24}$/.test(s) || /^[\u4e00-\u9fa5]{2,4}(老师|教师)$/.test(s);
  }

  /** 判断一个词是不是教室/地点（含数字的基本都是） */
  function isRoomToken(t) {
    var s = normText(t).replace(/\s+/g, '');
    if (!s || s.length > 24) return false;
    if (/周|节/.test(s)) return false;
    if (looksLikeRoom(s)) return true;
    if (/\d/.test(s) && !/^[\u4e00-\u9fa5]{2,}$/.test(s)) return true;
    return false;
  }

  function stripParensAboutWeeks(line) {
    return line.replace(/[(（][^()（）]*周[^()（）]*[)）]/g, '').trim();
  }

  /** 清洗课程名：去掉学年、学期、括号标记、周次、节次、时间等噪音 */
  function cleanName(line) {
    var s = stripParensAboutWeeks(normText(line));
    s = s
      .replace(/^\d{4}\s*[-~]\s*\d{4}\s*学年(度)?/, '')
      .replace(/^第[一二三四五六七八九十\d]+\s*学期/, '')
      .replace(/^\d{1,2}(?:\s*[-~至,、]\s*\d{1,2})*\s*[单双]?\s*周/, '')
      .replace(/^[(（\[【][^)）\]】]{0,20}[)）\]】]/, '')
      .replace(/\d{1,2}(?:\s*[-~至,、]\s*\d{1,2})*\s*[单双]?\s*周/g, '')
      .replace(/第?\d{1,2}(?:[-,、~至]\d{1,2})?节/g, '')
      .replace(/\d{1,2}:\d{2}\s*[-~]\s*\d{1,2}:\d{2}/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    return s.replace(/^[\s,，;；、]+|[\s,，;；、]+$/g, '');
  }

  /**
   * 把一个单元格文本拆成课程对象字段
   * 典型内容：
   *   高等数学\n张老师\n1-16周\nA101
   *   大学英语(1-16周) 王老师 B203
   *   体育\n1-16周(单)
   * 规则：第一个有效行/词 = 课程名，其余按「含数字=教室」「2-4汉字=教师」分类，剩下的进备注。
   */
  function splitCellText(text) {
    var raw = normText(text);
    if (!raw) return null;

    var weeks = parseWeeks(raw);
    var slots = parseSlots(raw);
    var room = null;
    var teacher = null;
    var note = '';
    var name = '';

    var lines = raw.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);

    if (lines.length === 1) {
      // 单行：先把 周次 / 节次 / 时间 片段抠掉，剩下的按空白切词
      var rest = lines[0]
        .replace(/[(（][^()（）]*周[^()（）]*[)）]/g, ' ')
        .replace(/\d{1,2}(?:\s*[-~至,、]\s*\d{1,2})*\s*[单双]?\s*周[^,，;；\s]*/g, ' ')
        .replace(/第?\d{1,2}(?:[-,、~至]\d{1,2})?节/g, ' ')
        .replace(/\d{1,2}:\d{2}\s*[-~]\s*\d{1,2}:\d{2}/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      var tokens = rest.split(/[\s,，;；|｜]+/).filter(Boolean);
      if (tokens.length) {
        name = cleanName(tokens.shift());
        tokens.forEach(function (tok) {
          if (!room && isRoomToken(tok)) { room = tok; return; }
          if (!teacher && looksLikeTeacher(stripParensAboutWeeks(tok))) { teacher = stripParensAboutWeeks(tok); return; }
          note = note ? note + ' ' + tok : tok;
        });
      }
    } else {
      var pool = lines.slice();
      name = cleanName(pool.shift() || '');
      if (!name && pool.length) name = cleanName(pool.shift() || '');
      pool.forEach(function (l) {
        var plain = stripParensAboutWeeks(l)
          .replace(/\d{1,2}(?:\s*[-~至,、]\s*\d{1,2})*\s*[单双]?\s*周/g, '')
          .replace(/第?\d{1,2}(?:[-,、~至]\d{1,2})?节/g, '')
          .replace(/\s+/g, ' ')
          .trim();
        if (!plain) return;                                  // 纯周次行，跳过
        if (!room && isRoomToken(plain)) { room = plain; return; }
        if (!teacher && looksLikeTeacher(plain)) { teacher = plain; return; }
        note = note ? note + ' / ' + plain : plain;
      });
    }

    if (!name) return null;

    return {
      name: name,
      teacher: teacher || '',
      room: room || '',
      weeks: weeks ? weeks.weeks : null,
      parity: weeks ? weeks.parity : 'all',
      slotStart: slots ? slots.start : null,
      slotEnd: slots ? slots.end : null,
      note: note || '',
      raw: raw.replace(/\n/g, ' ')
    };
  }

  /* ============================ 极简 HTML 解析器（Node 兜底） ============================ */
  /* 浏览器里优先用原生 DOMParser；这里只需要支持 <table>/<tr>/<td>/<br> 等常见结构 */

  var VOID_TAGS = { br: 1, hr: 1, img: 1, input: 1, meta: 1, link: 1, area: 1, base: 1, col: 1, embed: 1, source: 1, track: 1, wbr: 1 };
  var RAW_TAGS = { script: 1, style: 1, textarea: 1, title: 1 };

  function makeEl(tagName, attrs) {
    return { nodeType: 1, tagName: tagName, attrs: attrs || {}, childNodes: [], parentNode: null };
  }
  function makeText(t) {
    return { nodeType: 3, nodeValue: t };
  }

  function findTagEnd(html, from) {
    var quote = 0;
    for (var i = from; i < html.length; i++) {
      var c = html.charAt(i);
      if (quote) { if (c === quote) quote = 0; continue; }
      if (c === '"' || c === "'") { quote = c; continue; }
      if (c === '>') return i;
    }
    return -1;
  }

  function parseAttrs(str) {
    var attrs = {}, re = /([^\s"'=<>\/]+)(?:\s*=\s*("([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g, m;
    while ((m = re.exec(str))) {
      var name = m[1].toLowerCase();
      var value = m[3] !== undefined ? m[3] : (m[4] !== undefined ? m[4] : (m[5] !== undefined ? m[5] : ''));
      attrs[name] = value;
    }
    return attrs;
  }

  function parseHTML(html) {
    var root = makeEl('#root');
    var stack = [root];
    var i = 0;
    var len = html.length;

    function appendText(t) {
      if (!t) return;
      var parent = stack[stack.length - 1];
      parent.childNodes.push(makeText(t));
    }

    while (i < len) {
      var lt = html.indexOf('<', i);
      if (lt < 0) { appendText(html.slice(i)); break; }
      if (lt > i) appendText(html.slice(i, lt));

      if (html.substr(lt, 4) === '<!--') {
        var ce = html.indexOf('-->', lt);
        i = ce < 0 ? len : ce + 3;
        continue;
      }
      if (html.charAt(lt + 1) === '!' || html.charAt(lt + 1) === '?') {
        var de = html.indexOf('>', lt);
        i = de < 0 ? len : de + 1;
        continue;
      }

      var gt = findTagEnd(html, lt + 1);
      if (gt < 0) { appendText(html.slice(lt)); break; }
      var tagStr = html.slice(lt + 1, gt);
      i = gt + 1;

      if (tagStr.charAt(0) === '/') {
        var closeName = tagStr.slice(1).trim().toLowerCase();
        for (var s = stack.length - 1; s > 0; s--) {
          if (stack[s].tagName === closeName) { stack.length = s; break; }
        }
        continue;
      }

      var selfClose = /\/$/.test(tagStr);
      if (selfClose) tagStr = tagStr.slice(0, -1);
      var sp = tagStr.search(/[\s]/);
      var tagName = (sp < 0 ? tagStr : tagStr.slice(0, sp)).toLowerCase();
      if (!/^[a-z][a-z0-9-]*$/.test(tagName)) continue;

      var el = makeEl(tagName, parseAttrs(sp < 0 ? '' : tagStr.slice(sp + 1)));
      var parent = stack[stack.length - 1];
      parent.childNodes.push(el);
      el.parentNode = parent;

      if (VOID_TAGS[tagName] || selfClose) continue;

      if (RAW_TAGS[tagName]) {
        var endRe = new RegExp('</' + tagName + '\\s*>', 'i');
        var rest = html.slice(i);
        var mm = rest.match(endRe);
        var raw = mm ? rest.slice(0, mm.index) : rest;
        if (raw) el.childNodes.push(makeText(raw));
        i += mm ? mm.index + mm[0].length : rest.length;
        continue;
      }
      stack.push(el);
    }
    return root;
  }

  /* ---------- DOM 通用读取（原生 DOM 与 shim 统一接口） ---------- */

    return map;

  /* ======================= 内容流解析 ======================= */

  function parseContent(text, pageNo, items, rects) {
    var tm = [1, 0, 0, 1, 0, 0];
    var fontSize = 0;
    var st = [];
    var i = 0;
    var n = text.length;
    while (i < n) {
      var c = text[i];
      if (c === '(') {
        var depth = 1, j = i + 1, body = '';
        while (j < n && depth > 0) {
          var ch = text[j];
          if (ch === '\\') { body += ch + (text[j + 1] || ''); j += 2; continue; }
          if (ch === '(') depth++;
          else if (ch === ')') { depth--; if (depth === 0) break; }
          body += ch;
          j++;
        }
        st.push({ str: literalToBytes(body) });
        i = j + 1;
        continue;
      }
      var opm = /^[A-Za-z'"*]+/.exec(text.slice(i, i + 6));
      if (opm) {
        var op = opm[0];
        i += op.length;
        if (op === 'Tm' && st.length >= 6) {
          tm = st.slice(-6).map(function (v) { return typeof v.num === 'number' ? v.num : 0; });
        } else if (op === 'Td') {
          var nums = st.filter(function (v) { return typeof v.num === 'number'; });
          if (nums.length >= 2) {
            var dx = nums[nums.length - 1].num;
            var dy = nums[nums.length - 2].num;
            tm = [tm[0], tm[1], tm[2], tm[3], tm[4] + dx, tm[5] + dy];
          }
        } else if (op === 'Tf') {
          var nums2 = st.filter(function (v) { return typeof v.num === 'number'; });
          if (nums2.length) fontSize = nums2[nums2.length - 1].num;
        } else if (op === 'Tj' || op === 'TJ') {
          for (var s = 0; s < st.length; s++) {
            if (st[s].str) {
              items.push({ page: pageNo, x: tm[4], y: tm[5], size: fontSize, text: decodeUcs2(st[s].str) });
            }
          }
        } else if (op === 're' && rects) {
          var nums3 = st.filter(function (v) { return typeof v.num === 'number'; });
          if (nums3.length >= 4) {
            var a = nums3.slice(-4).map(function (v) { return v.num; });
            rects.push({ page: pageNo, x: a[0], y: a[1], w: a[2], h: a[3] });
          }
        }
        st.length = 0;
        continue;
      }
      var nm2 = /^-?\d*\.?\d+/.exec(text.slice(i, i + 24));
      if (nm2) { st.push({ num: parseFloat(nm2[0]) }); i += nm2[0].length; continue; }
      i++;
    }
  }

  /** 读取 PDF → [{page,x,y,size,text}] */
  function extractItems(arrayBuffer) {
    var bytes = new Uint8Array(arrayBuffer);
    var latin = bytesToLatin1(bytes);
    var objs = indexObjects(latin);

    var pageStreams = [];
    objs.forEach(function (o) {
      if (!/\/Type\s*\/Page[^s]/.test(o.dict)) return;
      var cm = /\/Contents\s+(\d+)\s+\d+\s+R/.exec(o.dict);
      if (cm) pageStreams.push(+cm[1]);
    });
    if (!pageStreams.length) return Promise.resolve({ items: [], pageCount: 0 });

    var items = [];
    var rects = [];
    var chain = Promise.resolve();
    pageStreams.forEach(function (num, idx) {
      chain = chain.then(function () {
        var o = objs.get(num);
        if (!o || !o.data) return;
        var raw = bytes.subarray(o.data.start, o.data.start + o.data.length);
        var isFlate = /FlateDecode/.test(o.dict);
        var ready = isFlate ? inflate(raw) : Promise.resolve(raw);
        return ready.then(function (out) {
          parseContent(bytesToLatin1(out), idx + 1, items, idx === 0 ? rects : null);
        }).catch(function () { /* 单页失败不影响其它页 */ });
      });
    });
    return chain.then(function () {
      return { items: items, rects: rects, pageCount: pageStreams.length };
    });
  }

  /* ======================= 网格 → 课程 ======================= */

  /** 从表头找 7 列 x 坐标 */
  function findDayColumns(items) {
    var head = items.filter(function (it) {
      return it.page === 1 && /^星期[一二三四五六日]$/.test(it.text);
    });
    if (head.length < 5) return null;
    var cols = head.map(function (h) {
      return { day: DAY_CHARS.indexOf(h.text.slice(-1)) + 1, x: h.x };
    }).sort(function (a, b) { return a.x - b.x; });
    // 表头文字居中，列左边界 ≈ 表头 x - 45（由实际 PDF 反推，约半列宽减字宽）
    var bounds = cols.map(function (c) { return c.x - 45; });
    return { cols: cols, bounds: bounds, headerY: head[0].y };
  }

  /** 判断碎片文本是不是「上一格详情的尾巴」而不是「下一格的课程名开头」 */
  function looksLikeDetailTail(text) {
    var t = (text || '').trim();
    if (!t) return true;
    if (/^\//.test(t)) return true;                                   // /场地:…
    if (/(校区|场地|教师|教学班|选课备注|课备注):/.test(t)) return true; // 任何详情字段
    if (/^(注:|班:|组成:|学班|学组成|教学班)/.test(t)) return true;     // 续行常见开头
    if (/\/$/.test(t)) return true;                                   // 以 / 结尾 = 被截断的详情
    return false;
  }

  /** 按行距切分单元格块 */
  function splitBlocks(list) {
    var blocks = [];
    var cur = [];
    var prev = null;
    for (var i = 0; i < list.length; i++) {
      var it = list[i];
      var newPage = prev && it.page !== prev.page;
      var dy = prev ? prev.y - it.y : 0;
      var sameBlock = prev && !newPage && dy > LINE_HEIGHT_MIN && dy < LINE_HEIGHT_MAX;
      if (cur.length && !sameBlock) { blocks.push(cur); cur = []; }
      cur.push(it);
      prev = it;
    }
    if (cur.length) blocks.push(cur);

    // 没有 (x-y节) 的碎片：详情尾巴并回「上一块」，名字碎片挂到「下一块」
    var out = [];
    var pending = null;
    for (var b = 0; b < blocks.length; b++) {
      var joined = blocks[b].map(function (x) { return x.text; }).join('');
      if (/\(\d{1,2}-\d{1,2}节\)/.test(joined)) {
        out.push(pending ? pending.concat(blocks[b]) : blocks[b]);
        pending = null;
      } else if (looksLikeDetailTail(joined) && out.length) {
        out[out.length - 1] = out[out.length - 1].concat(blocks[b]);
      } else {
        pending = pending ? pending.concat(blocks[b]) : blocks[b];
      }
    }
    if (pending) {
      if (out.length) out[out.length - 1] = out[out.length - 1].concat(pending);
      else out.push(pending);
    }
    return out;
  }

  /** 周次字符串 → 周号数组，支持 5周 / 2周,7周 / 5-6周 / 7-9周(单) */
  function expandWeeks(s) {
    var parity = 'all';
    if (/[单双]/.test(s)) parity = /双/.test(s) ? 'even' : 'odd';
    var weeks = [];
    var re = /(\d{1,2})(?:\s*[-~至]\s*(\d{1,2}))?/g;
    var m;
    while ((m = re.exec(s))) {
      var a = +m[1];
      var b = m[2] ? +m[2] : a;
      for (var w = a; w <= b && w <= 60; w++) {
        if (parity === 'odd' && w % 2 === 0) continue;
        if (parity === 'even' && w % 2 === 1) continue;
        if (weeks.indexOf(w) < 0) weeks.push(w);
      }
    }
    return weeks.sort(function (x, y) { return x - y; });
  }

  /** 单元格文本 → 课程字段 */
  function parseBlockText(raw) {
    var slotM = /\((\d{1,2})\s*-\s*(\d{1,2})节\)/.exec(raw);
    if (!slotM) return null;
    var name = raw.slice(0, slotM.index).trim();
    // 兜底：如果课程名里混进了详情字段（块拼接不完美时），取最后一个 : 或 / 之后的部分
    if (/^\/|(校区|场地|教师|教学班|选课备注|课备注):/.test(name)) {
      var cut = Math.max(name.lastIndexOf(':'), name.lastIndexOf('/'));
      if (cut >= 0) name = name.slice(cut + 1).trim();
    }
    name = name.replace(/^[/:]+/, '').replace(/[○*※☆●◆]+$/, '').trim();
    if (!name) return null;
    if (/^(注|备注)$/.test(name)) return null;

    var after = raw.slice(slotM.index + slotM[0].length);
    var weekPart = (after.split('/')[0] || '').trim();
    var weeks = expandWeeks(weekPart);
    var grab = function (key) {
      var mm = new RegExp('/' + key + ':([^/]*)').exec(after);
      return mm ? mm[1].trim() : '';
    };
    var campus = grab('校区');
    return {
      name: name,
      start: +slotM[1],
      end: +slotM[2],
      weeks: weeks,
      teacher: grab('教师'),
      room: grab('场地'),
      campus: campus,
      note: campus ? '校区:' + campus : '',
      raw: raw
    };
  }

  function dedupe(list) {
    var seen = {};
    var out = [];
    list.forEach(function (c) {
      var key = [c.name, c.day, c.start, c.end, (c.weeks || []).join(','), c.teacher, c.room].join('|');
      if (!seen[key]) { seen[key] = 1; out.push(c); }
    });
    return out;
  }

  /** 纯函数：文字项 → 课程（便于单测） */
  function itemsToCourses(items) {
    if (!items || !items.length) return { ok: false, courses: [], reason: 'PDF 里没有文字层（可能是扫描件）' };
    var grid = findDayColumns(items);
    if (!grid) {
      return { ok: false, courses: [], reason: '没找到「星期一…星期日」表头，可能不是课表 PDF' };
    }

    var buckets = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [] };
    items.forEach(function (it) {
      if (!it.text) return;
      if (it.page === 1 && it.y > grid.headerY - 2) return;     // 表头/标题/学号行
      if (it.page !== 1 && it.size > 10) return;                 // 续页大标题
      if (/^星期[一二三四五六日]$/.test(it.text)) return;
      var col = 0;
      for (var b = grid.bounds.length - 1; b >= 0; b--) {
        if (it.x >= grid.bounds[b]) { col = b + 1; break; }
      }
      if (!col) return;
      buckets[grid.cols[col - 1].day].push(it);
    });

    var courses = [];
    for (var d = 1; d <= 7; d++) {
      var list = buckets[d].slice().sort(function (a, b) {
        return (a.page - b.page) || (b.y - a.y);
      });
      splitBlocks(list).forEach(function (block) {
        var parsed = parseBlockText(block.map(function (x) { return x.text; }).join(''));
        if (parsed) { parsed.day = d; courses.push(parsed); }
      });
    }

    courses = dedupe(courses).sort(function (a, b) {
      return a.day - b.day || a.start - b.start || (a.name > b.name ? 1 : -1);
    });
    return {
      ok: courses.length > 0,
      courses: courses,
      pageCount: 0,
      reason: courses.length ? '' : '找到了表头但没解析出课程，可能格式与预期不同'
    };
  }

  /** 主入口：ArrayBuffer → 课程 */
  function parse(arrayBuffer) {
    return extractItems(arrayBuffer).then(function (res) {
      var out = itemsToCourses(res.items);
      out.pageCount = res.pageCount;
      out.itemCount = res.items.length;
      return out;
    });
  }

  return {
    version: '1.0',
    parse: parse,
    extractItems: extractItems,
    itemsToCourses: itemsToCourses,
    expandWeeks: expandWeeks,
    parseBlockText: parseBlockText,
    literalToBytes: literalToBytes,
    decodeUcs2: decodeUcs2
  };
});

</script>
<script>
/* ============================================================
   课程表 App  ·  逻辑层
   依赖：assets/parser.js（CourseParser）
   ============================================================ */
(function () {
  'use strict';

  var P = window.CourseParser;
  var STORE_KEY = 'coursetable.v1';
  var APP_VERSION = '1.0.0';

  var WD_SHORT = ['一', '二', '三', '四', '五', '六', '日'];
  var WD_FULL = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

  var PALETTE = [
    '#4f7cff', '#f2586f', '#16b6a4', '#f79c22', '#8a6bf6',
    '#2f9fe0', '#e8643f', '#2fb56b', '#d851a8', '#7a8ca8'
  ];

  var DEFAULT_PERIODS = [
    { n: 1, s: '08:00', e: '08:45' }, { n: 2, s: '08:55', e: '09:40' },
    { n: 3, s: '10:00', e: '10:45' }, { n: 4, s: '10:55', e: '11:40' },
    { n: 5, s: '14:00', e: '14:45' }, { n: 6, s: '14:55', e: '15:40' },
    { n: 7, s: '16:00', e: '16:45' }, { n: 8, s: '16:55', e: '17:40' },
    { n: 9, s: '19:00', e: '19:45' }, { n: 10, s: '19:55', e: '20:40' },
    { n: 11, s: '20:50', e: '21:35' }, { n: 12, s: '21:45', e: '22:30' }
  ];

  /* ---------------- 小工具 ---------------- */

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s || ''));
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function md(d) { return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function uid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function uniqNum(arr) {
    var seen = {}, out = [];
    arr.forEach(function (v) { v = Number(v); if (v >= 1 && v <= 60 && !seen[v]) { seen[v] = 1; out.push(v); } });
    return out.sort(function (a, b) { return a - b; });
  }

  /* ---------------- 存储 ---------------- */

  var storeOk = true;

  function defaultSettings() {
    return {
      title: '我的课程表',
      termStart: ymd(mondayOf(new Date())),
      totalWeeks: 20,
      periods: DEFAULT_PERIODS.map(function (p) { return { n: p.n, s: p.s, e: p.e }; })
    };
  }

  var state = {
    courses: [],
    settings: defaultSettings(),
    view: 'day',
    week: 1,
    day: 1
  };

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); }
    catch (e) { storeOk = false; }
    if (!raw) return;
    try {
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.courses)) state.courses = data.courses.map(normalizeCourse).filter(Boolean);
      if (data && data.settings) state.settings = mergeSettings(data.settings);
    } catch (e) { /* 数据损坏，忽略 */ }
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, courses: state.courses, settings: state.settings }));
      storeOk = true;
    } catch (e) {
      storeOk = false;
    }
  }

  function mergeSettings(s) {
    var d = defaultSettings();
    var out = {
      title: typeof s.title === 'string' && s.title ? s.title : d.title,
      termStart: parseYmd(s.termStart) ? ymd(parseYmd(s.termStart)) : d.termStart,
      totalWeeks: clamp(parseInt(s.totalWeeks, 10) || d.totalWeeks, 1, 40),
      periods: d.periods
    };
    if (Array.isArray(s.periods) && s.periods.length >= 1) {
      out.periods = s.periods.slice(0, 20).map(function (p, i) {
        return {
          n: i + 1,
          s: /^\d{1,2}:\d{2}$/.test(p && p.s) ? p.s : d.periods[i] ? d.periods[i].s : '08:00',
          e: /^\d{1,2}:\d{2}$/.test(p && p.e) ? p.e : d.periods[i] ? d.periods[i].e : '08:45'
        };
      }).map(function (p, i) { return { n: i + 1, s: p.s, e: p.e }; });
    }
    return out;
  }

  function normalizeCourse(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var name = String(raw.name || '').trim().slice(0, 50);
    if (!name) return null;
    var start = clamp(parseInt(raw.start, 10) || 1, 1, 20);
    var end = clamp(parseInt(raw.end, 10) || start, start, 20);
    return {
      id: raw.id || uid(),
      name: name,
      teacher: String(raw.teacher || '').trim().slice(0, 40),
      room: String(raw.room || '').trim().slice(0, 40),
      day: clamp(parseInt(raw.day, 10) || 1, 1, 7),
      start: start,
      end: end,
      weeks: Array.isArray(raw.weeks) && raw.weeks.length ? uniqNum(raw.weeks) : null,
      note: String(raw.note || '').trim().slice(0, 200),
      color: /^#[0-9a-f]{3,8}$/i.test(raw.color || '') ? raw.color : null
    };
  }

  /* ---------------- 日期 / 周次 ---------------- */

  function termStart() { return parseYmd(state.settings.termStart) || mondayOf(new Date()); }

  function currentWeekNo() {
    var diff = Math.floor((mondayOf(new Date()) - termStart()) / 86400000 / 7) + 1;
    return diff < 1 ? 1 : diff;
  }

  function weekDates(week) {
    var base = addDays(termStart(), (week - 1) * 7);
    var out = [];
    for (var i = 0; i < 7; i++) out.push(addDays(base, i));
    return out;
  }

  function courseActive(c, week) {
    if (!c.weeks || !c.weeks.length) return true;
    return c.weeks.indexOf(week) >= 0;
  }

  function coursesForDay(day, week) {
    return state.courses
      .filter(function (c) { return c.day === day && courseActive(c, week); })
      .sort(function (a, b) { return a.start - b.start || a.end - b.end || (a.name > b.name ? 1 : -1); });
  }

  function slotTime(start, end) {
    var ps = state.settings.periods;
    var a = ps[clamp(start, 1, ps.length) - 1];
    var b = ps[clamp(end, 1, ps.length) - 1];
    return { a: a ? a.s : '--:--', b: b ? b.e : '--:--' };
  }

  function weeksText(weeks) {
    if (!weeks || !weeks.length) return '每周';
    var s = uniqNum(weeks);
    var allOdd = s.every(function (w) { return w % 2 === 1; });
    var allEven = s.every(function (w) { return w % 2 === 0; });
    var parts = [], from = s[0], prev = s[0];
    for (var i = 1; i <= s.length; i++) {
      var w = s[i];
      if (w === prev + 1) { prev = w; continue; }
      parts.push(from === prev ? String(from) : from + '-' + prev);
      from = w; prev = w;
    }
    var txt = parts.join(',') + ' 周';
    if (s.length > 2 && allOdd) txt += '(单)';
    else if (s.length > 2 && allEven) txt += '(双)';
    return txt;
  }

  function colorFor(c) {
    if (c.color) return c.color;
    var h = 0;
    for (var i = 0; i < c.name.length; i++) h = (h * 31 + c.name.charCodeAt(i)) % 9973;
    return PALETTE[h % PALETTE.length];
  }

  function nowMinutes() {
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
  function hm2min(hm) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(hm || '');
    return m ? (+m[1]) * 60 + (+m[2]) : -1;
  }

  /* ---------------- toast ---------------- */

  var toastTimer = null;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ---------------- 弹层 ---------------- */

  function openSheet(title, bodyHtml, onMount, headExtra) {
    var sheet = $('#sheet');
    sheet.innerHTML =
      '<div class="sheet-head"><h2>' + esc(title) + '</h2>' + (headExtra || '') +
      '<button class="close" id="sheetClose" aria-label="关闭">✕</button></div>' +
      '<div class="sheet-body" id="sheetBody">' + bodyHtml + '</div>';
    $('#mask').classList.add('show');
    sheet.classList.add('show');
    $('#sheetClose').onclick = closeSheet;
    if (onMount) onMount($('#sheetBody'));
    sheet.scrollTop = 0;
    var body = $('#sheetBody');
    if (body) body.scrollTop = 0;
  }

  function closeSheet() {
    $('#sheet').classList.remove('show');
    $('#mask').classList.remove('show');
    setTimeout(function () {
      if (!$('#sheet').classList.contains('show')) $('#sheet').innerHTML = '';
    }, 280);
  }

  /* ---------------- 渲染：顶栏 / 星期条 ---------------- */

  function renderHeader() {
    var wk = state.week;
    $('#weekNum').textContent = '第 ' + wk + ' 周';
    var ds = weekDates(wk);
    $('#weekRange').textContent = md(ds[0]) + ' - ' + md(ds[6]);
    $('#curTag').hidden = wk !== currentWeekNo();
    document.title = state.settings.title || '课程表';
  }

  function renderStrip() {
    var todayYmd = ymd(new Date());
    var ds = weekDates(state.week);
    var html = '';
    for (var i = 0; i < 7; i++) {
      var day = i + 1;
      var d = ds[i];
      var isToday = ymd(d) === todayYmd;
      var has = coursesForDay(day, state.week).length > 0;
      html += '<button class="day-chip' +
        (day === state.day ? ' selected' : '') +
        (isToday ? ' today' : '') +
        (has ? ' has-course' : '') +
        '" data-day="' + day + '">' +
        '<span>' + WD_SHORT[i] + '</span><b>' + d.getDate() + '</b><i class="dot"></i></button>';
    }
    var el = $('#dayStrip');
    el.innerHTML = html;
    $all('.day-chip', el).forEach(function (btn) {
      btn.onclick = function () {
        state.day = +btn.dataset.day;
        switchView('day');
        renderAll();
      };
    });
  }

  /* ---------------- 渲染：日视图 ---------------- */

  function courseCard(c, isToday) {
    var t = slotTime(c.start, c.end);
    var now = nowMinutes();
    var a = hm2min(t.a), b = hm2min(t.b);
    var running = isToday && a >= 0 && b >= 0 && now >= a && now <= b;
    var past = isToday && b >= 0 && now > b;
    var tag = running ? '<span class="tag">进行中</span>' : '';
    var meta = [];
    if (c.teacher) meta.push('<i>👤 ' + esc(c.teacher) + '</i>');
    if (c.room) meta.push('<i>📍 ' + esc(c.room) + '</i>');
    return '<div class="lesson' + (running ? ' now' : '') + (past ? ' past' : '') + '" data-id="' + c.id + '" style="--c:' + colorFor(c) + '">' +
      '<div class="lesson-time"><b>' + c.start + (c.end !== c.start ? '-' + c.end : '') + '节</b>' +
      '<em>' + t.a + '</em><em>' + t.b + '</em></div>' +
      '<div class="lesson-body">' +
      '<div class="lesson-name">' + esc(c.name) + tag + '</div>' +
      (meta.length ? '<div class="lesson-meta">' + meta.join('') + '</div>' : '') +
      '<div class="lesson-week">' + esc(weeksText(c.weeks)) + (c.note ? ' · ' + esc(c.note) : '') + '</div>' +
      '</div></div>';
  }

  function renderDay() {
    var el = $('#dayView');
    var list = coursesForDay(state.day, state.week);
    var d = weekDates(state.week)[state.day - 1];
    var isToday = ymd(d) === ymd(new Date());
    var html = '<div class="day-head"><b>' + WD_FULL[state.day - 1] + (isToday ? ' · 今天' : '') + '</b>' +
      '<span>' + md(d) + '</span><span style="margin-left:auto">' + list.length + ' 节课</span></div>';

    if (!list.length) {
      html += '<div class="empty"><div class="big">☕️</div><p>这天没有课。<br>可以先导入课表，或手动加一节课。</p>' +
        '<div class="row"><button class="btn primary" id="emptyImport">导入课表</button>' +
        '<button class="btn" id="emptyAdd">手动添加</button></div>' +
        '<div style="margin-top:14px"><button class="link" id="emptyDemo">先看示例课表 →</button></div></div>';
    } else {
      list.forEach(function (c) { html += courseCard(c, isToday); });
    }
    el.innerHTML = html;

    var ei = $('#emptyImport'); if (ei) ei.onclick = openImport;
    var ea = $('#emptyAdd'); if (ea) ea.onclick = function () { openEditor(null); };
    var ed = $('#emptyDemo');
    if (ed) ed.onclick = function () {
      if (state.courses.length && !confirm('示例会覆盖现有课程，继续？')) return;
      seedDemo();
      toast('已载入示例课表');
    };
    $all('.lesson', el).forEach(function (node) {
      node.onclick = function () { openCourseDetail(node.dataset.id); };
    });
  }

  /* ---------------- 渲染：周视图 ---------------- */

  function renderWeek() {
    var el = $('#weekView');
    var ps = state.settings.periods;
    var rows = ps.length;
    var todayYmd = ymd(new Date());
    var ds = weekDates(state.week);

    var style = 'grid-template-columns:40px repeat(7,minmax(0,1fr));grid-template-rows:38px repeat(' + rows + ',56px);';
    var html = '<div class="wk-wrap"><div class="wk-grid" style="' + style + '">';

    html += '<div class="wk-corner"></div>';
    for (var d = 0; d < 7; d++) {
      var isToday = ymd(ds[d]) === todayYmd;
      html += '<div class="wk-dayhead' + (isToday ? ' today' : '') + '" style="grid-column:' + (d + 2) + ';grid-row:1">' +
        '<b>' + WD_SHORT[d] + '</b><small>' + (ds[d].getMonth() + 1) + '/' + ds[d].getDate() + '</small></div>';
    }

    for (var p = 1; p <= rows; p++) {
      var row = p + 1;
      var pd = ps[p - 1];
      html += '<div class="wk-time" style="grid-column:1;grid-row:' + row + '"><b>' + p + '</b><small>' + esc(pd.s) + '</small></div>';
      for (var dd = 0; dd < 7; dd++) {
        html += '<div class="wk-cell" style="grid-column:' + (dd + 2) + ';grid-row:' + row + '"></div>';
      }
    }

    // 课程块（叠加在网格上）
    for (var day = 1; day <= 7; day++) {
      coursesForDay(day, state.week).forEach(function (c) {
        var s = clamp(c.start, 1, rows);
        var e = clamp(c.end, s, rows);
        var t = slotTime(c.start, c.end);
        html += '<div class="wk-course" data-id="' + c.id + '" style="grid-column:' + (day + 1) + ';grid-row:' + (s + 1) + ' / ' + (e + 2) + ';--c:' + colorFor(c) + '">' +
          '<b>' + esc(c.name) + '</b>' +
          (c.room ? '<span>@' + esc(c.room) + '</span>' : '') +
          '<span>' + t.a + '</span></div>';
      });
    }
    html += '</div></div>';
    el.innerHTML = html;
    $all('.wk-course', el).forEach(function (node) {
      node.onclick = function () { openCourseDetail(node.dataset.id); };
    });
  }

  function renderAll() {
    renderHeader();
    renderStrip();
    // 周课表里已经有星期表头，隐藏上面的星期条，避免重复+对齐错位
    $('#dayStrip').hidden = state.view === 'week';
    if (state.view === 'day') {
      $('#dayView').hidden = false;
      $('#weekView').hidden = true;
      renderDay();
    } else {
      $('#dayView').hidden = true;
      $('#weekView').hidden = false;
      renderWeek();
    }
    $all('.tab[data-view]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.view === state.view);
    });
  }

  function switchView(v) {
    state.view = v;
    renderAll();
  }

  /* ---------------- 课程详情 ---------------- */

  function findCourse(id) {
    for (var i = 0; i < state.courses.length; i++) if (state.courses[i].id === id) return state.courses[i];
    return null;
  }

  function openCourseDetail(id) {
    var c = findCourse(id);
    if (!c) return;
    var t = slotTime(c.start, c.end);
    var rows = [
      ['课程', c.name],
      ['时间', WD_FULL[c.day - 1] + ' · 第 ' + c.start + (c.end !== c.start ? '-' + c.end : '') + ' 节（' + t.a + ' - ' + t.b + '）'],
      ['周次', weeksText(c.weeks)],
      ['教师', c.teacher || '—'],
      ['教室', c.room || '—'],
      ['备注', c.note || '—']
    ];
    var html = '<div style="border-left:4px solid ' + colorFor(c) + ';padding-left:12px;margin-bottom:14px">' +
      '<div style="font-size:18px;font-weight:600">' + esc(c.name) + '</div>' +
      '<div style="color:var(--text-3);font-size:12px">' + esc(weeksText(c.weeks)) + '</div></div>' +
      '<div class="settings-list">';
    rows.slice(1).forEach(function (r) {
      html += '<div class="settings-row"><div class="label">' + esc(r[0]) + '</div><div style="color:var(--text-2);font-size:13px;text-align:right">' + esc(r[1]) + '</div></div>';
    });
    html += '</div><div class="row-btns" style="margin-top:16px">' +
      '<button class="btn primary" id="btnEditCourse">编辑</button>' +
      '<button class="btn danger" id="btnDelCourse">删除</button></div>';

    openSheet('课程详情', html, function () {
      $('#btnEditCourse').onclick = function () { openEditor(c); };
      $('#btnDelCourse').onclick = function () {
        if (!confirm('确定删除「' + c.name + '」？')) return;
        state.courses = state.courses.filter(function (x) { return x.id !== c.id; });
        save(); closeSheet(); renderAll(); toast('已删除');
      };
    });
  }

  /* ---------------- 课程编辑 ---------------- */

  function openEditor(course) {
    var isNew = !course;
    var c = course || {
      id: uid(), name: '', teacher: '', room: '',
      day: state.day, start: 1, end: 2, weeks: null, note: ''
    };
    var ps = state.settings.periods;
    var maxP = ps.length;

    var dayOpts = '';
    for (var i = 1; i <= 7; i++) dayOpts += '<option value="' + i + '"' + (c.day === i ? ' selected' : '') + '>' + WD_FULL[i - 1] + '</option>';
    var pOpts = '';
    for (var p = 1; p <= maxP; p++) pOpts += '<option value="' + p + '">第 ' + p + ' 节</option>';

    var weeks = c.weeks || null;
    var from = weeks ? weeks[0] : 1;
    var to = weeks ? weeks[weeks.length - 1] : clamp(state.settings.totalWeeks || 16, 1, 40);
    var parity = 'all';
    if (weeks && weeks.length > 2) {
      if (weeks.every(function (w) { return w % 2 === 1; })) parity = 'odd';
      else if (weeks.every(function (w) { return w % 2 === 0; })) parity = 'even';
    }

    var html =
      '<div class="field"><label>课程名称 *</label><input class="input" id="f_name" maxlength="50" placeholder="例如：高等数学" value="' + esc(c.name) + '"></div>' +
      '<div class="grid-2"><div class="field"><label>教师</label><input class="input" id="f_teacher" maxlength="40" placeholder="选填" value="' + esc(c.teacher) + '"></div>' +
      '<div class="field"><label>教室</label><input class="input" id="f_room" maxlength="40" placeholder="选填" value="' + esc(c.room) + '"></div></div>' +
      '<div class="grid-3"><div class="field"><label>星期</label><select class="select" id="f_day">' + dayOpts + '</select></div>' +
      '<div class="field"><label>开始节次</label><select class="select" id="f_start">' + pOpts + '</select></div>' +
      '<div class="field"><label>结束节次</label><select class="select" id="f_end">' + pOpts + '</select></div></div>' +
      '<div class="field"><label>周次</label><select class="select" id="f_wmode">' +
      '<option value="all"' + (!weeks ? ' selected' : '') + '>每周都有</option>' +
      '<option value="range"' + (weeks ? ' selected' : '') + '>指定周次范围</option></select></div>' +
      '<div class="grid-3" id="f_weekbox" style="' + (weeks ? '' : 'display:none') + '">' +
      '<div class="field"><label>起始周</label><input class="input" id="f_from" type="number" min="1" max="40" value="' + from + '"></div>' +
      '<div class="field"><label>结束周</label><input class="input" id="f_to" type="number" min="1" max="40" value="' + to + '"></div>' +
      '<div class="field"><label>单双周</label><select class="select" id="f_parity">' +
      '<option value="all"' + (parity === 'all' ? ' selected' : '') + '>全部</option>' +
      '<option value="odd"' + (parity === 'odd' ? ' selected' : '') + '>单周</option>' +
      '<option value="even"' + (parity === 'even' ? ' selected' : '') + '>双周</option></select></div></div>' +
      '<div class="field"><label>备注</label><input class="input" id="f_note" maxlength="200" placeholder="选填，例如：带教材" value="' + esc(c.note) + '"></div>' +
      '<div class="row-btns"><button class="btn" id="btnCancel">取消</button><button class="btn primary" id="btnSave">保存</button></div>';

    openSheet(isNew ? '添加课程' : '编辑课程', html, function () {
      $('#f_start').value = c.start;
      $('#f_end').value = c.end;
      $('#f_wmode').onchange = function () {
        $('#f_weekbox').style.display = this.value === 'range' ? '' : 'none';
      };
      $('#btnCancel').onclick = closeSheet;
      $('#btnSave').onclick = function () {
        var name = $('#f_name').value.trim();
        if (!name) { toast('请填写课程名称'); $('#f_name').focus(); return; }
        var start = clamp(parseInt($('#f_start').value, 10) || 1, 1, maxP);
        var end = clamp(parseInt($('#f_end').value, 10) || start, 1, maxP);
        if (end < start) { var t = start; start = end; end = t; }
        var mode = $('#f_wmode').value;
        var wk = null;
        if (mode === 'range') {
          var a = clamp(parseInt($('#f_from').value, 10) || 1, 1, 40);
          var b = clamp(parseInt($('#f_to').value, 10) || a, 1, 40);
          if (b < a) { var q = a; a = b; b = q; }
          var par = $('#f_parity').value;
          var arr = [];
          for (var w = a; w <= b; w++) {
            if (par === 'odd' && w % 2 === 0) continue;
            if (par === 'even' && w % 2 === 1) continue;
            arr.push(w);
          }
          wk = arr;
        }
        var data = normalizeCourse({
          id: c.id,
          name: name,
          teacher: $('#f_teacher').value,
          room: $('#f_room').value,
          day: parseInt($('#f_day').value, 10),
          start: start, end: end,
          weeks: wk,
          note: $('#f_note').value,
          color: c.color || null
        });
        var idx = -1;
        for (var i = 0; i < state.courses.length; i++) if (state.courses[i].id === data.id) idx = i;
        if (idx >= 0) state.courses[idx] = data;
        else state.courses.push(data);
        save(); closeSheet(); renderAll();
        toast(isNew ? '已添加' : '已保存');
      };
    });
  }

  /* ---------------- 导入 ---------------- */

  var BOOKMARKLET = "javascript:(function(){" +
    "var T=[].slice.call(document.querySelectorAll('table')),B=null,M=0;" +
    "T.forEach(function(t){var n=0;[].forEach.call(t.querySelectorAll('td,th'),function(c){var x=(c.innerText||c.textContent||'').replace(/\\s/g,'');if(/(星期|周|礼拜)[一二三四五六日天]/.test(x)&&x.length<12)n++;});if(n>M){M=n;B=t;}});" +
    "var h=B?B.outerHTML:'';" +
    "var ta=document.createElement('textarea');ta.value=h;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();" +
    "var ok=false;try{ok=document.execCommand('copy');}catch(e){}" +
    "ta.remove();" +
    "alert(B?('已复制课表表格（共'+M+'个星期表头），\\n打开课程表 App →「导入→粘贴导入」即可。'):'页面上没找到课表表格。\\n请用手机/电脑「另存为 HTML」再导入，或直接手动添加。');" +
    "})();";

  function importSheetHtml(tab) {
    var tabs = '<div class="import-tabs">' +
      '<button data-tab="pdf" class="' + (tab === 'pdf' ? 'on' : '') + '">PDF 课表</button>' +
      '<button data-tab="paste" class="' + (tab === 'paste' ? 'on' : '') + '">粘贴导入</button>' +
      '<button data-tab="file" class="' + (tab === 'file' ? 'on' : '') + '">文件导入</button>' +
      '<button data-tab="bookmark" class="' + (tab === 'bookmark' ? 'on' : '') + '">书签抓取</button>' +
      '</div>';

    var body = '';
    if (tab === 'pdf') {
      body =
        '<div class="tip"><b>用学校导出的课表 PDF 直接导入：</b><ol>' +
        '<li>在「学教一体化」里导出课表 PDF（手机或电脑导出都行）；</li>' +
        '<li>把 PDF 传到手机（微信/QQ 发给自己），点下面的「选择课表 PDF」；</li>' +
        '<li>解析完先核对预览，没问题再点「替换全部」。</li></ol>' +
        '<div style="margin-top:8px">PDF <b>只在这台设备上解析，不会上传</b>；课表按「每次上课」逐条导入，' +
        '所以每周看到的教师和地点都是当周真实的。</div></div>' +
        '<div class="row-btns" style="margin-top:14px"><button class="btn primary block" id="btnPickPdf">📄 选择课表 PDF</button></div>' +
        '<input type="file" id="pdfInput" accept="application/pdf,.pdf" class="sr">' +
        '<div id="previewBox"></div>';
    } else if (tab === 'paste') {
      body =
        '<div class="tip"><b>从教务系统 / 学教一体化复制课表：</b><ol>' +
        '<li>电脑上打开课表页面，选中整张课表（或整个页面）复制；</li>' +
        '<li>回到这里点「读取剪贴板」；</li>' +
        '<li>或者手动粘贴到下框再点「解析」。</li></ol></div>' +
        '<div class="row-btns" style="margin:12px 0"><button class="btn primary block" id="btnClip">📋 读取剪贴板并解析</button></div>' +
        '<div class="field"><label>或者在这里粘贴（网页 HTML / Excel 表格 / CSV 都行）</label>' +
        '<textarea class="textarea" id="importText" placeholder="把课表内容粘贴到这里…"></textarea></div>' +
        '<div class="row-btns"><button class="btn block" id="btnParse">解析</button></div>' +
        '<div id="previewBox"></div>';
    } else if (tab === 'file') {
      body =
        '<div class="tip"><b>支持文件：</b>' + '<span class="chip">.pdf 课表</span><span class="chip">.html</span><span class="chip">.htm</span><span class="chip">.csv</span><span class="chip">.tsv</span><span class="chip">.txt</span><span class="chip">.json（备份）</span>' +
        '<div style="margin-top:8px">课表 PDF 直接选进来即可（会自动走 PDF 解析）；网页最稳的办法是按 <b>Ctrl+S 另存为「网页，仅 HTML」</b>。</div>' +
        '<div style="margin-top:6px">Excel 的 .xlsx 不直接支持 —— 在 Excel 里全选复制，用「粘贴导入」即可。</div></div>' +
        '<div class="row-btns" style="margin-top:14px"><button class="btn primary block" id="btnPick">选择文件</button></div>' +
        '<input type="file" id="fileInput" accept=".pdf,.html,.htm,.txt,.csv,.tsv,.json,.xls,.xlsx" class="sr">' +
        '<div id="previewBox"></div>';
    } else {
      body =
        '<div class="tip"><b>一键抓取（推荐，最省事）：</b><ol>' +
        '<li>把下面这段代码存成书签（或直接复制）；</li>' +
        '<li>在课表页面地址栏/书签栏运行它；</li>' +
        '<li>它会复制课表表格 → 回来用「粘贴导入」。</li></ol>' +
        '<div style="margin-top:8px;color:var(--text-3)">手机浏览器一般不支持书签脚本，手机上建议用「文件导入」或直接手动录入。</div></div>' +
        '<div class="field" style="margin-top:12px"><label>书签脚本</label>' +
